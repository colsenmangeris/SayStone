name: Build and Test

on:
  pull_request:
    branches: [ main, feat/mac-workflows ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main, feat/mac-workflows ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.relevant == 'true' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Detect build-related changes
      id: filter
      if: github.event_name != 'workflow_dispatch'
      uses: dorny/paths-filter@v3
      with:
        filters: |
          relevant:
            - 'Sources/**'
            - 'Tests/**'
            - 'scripts/local/**'
            - 'build.sh'
            - 'SayStone.xcodeproj/**'
            - 'Package.swift'
            - 'Package.resolved'
            - 'Info.plist'
            - 'Fluid.entitlements'
            - '.swiftlint.yml'
            - '.github/workflows/build.yml'

  lint:
    name: SwiftLint
    if: needs.changes.outputs.relevant == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run SwiftLint (strict)
      run: |
        docker run --rm \
          --volume "$PWD:$PWD" \
          --workdir "$PWD" \
          ghcr.io/realm/swiftlint:0.63.2 \
          lint --strict --config .swiftlint.yml

  build:
    name: Isolated Mac build and fixtures
    # Strict lint still fails when violations exist. Run the build
    # independently so inherited lint debt does not hide compilation/test evidence.
    if: needs.changes.outputs.relevant == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: changes
    runs-on: macos-latest
    timeout-minutes: 40
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Show Xcode version
      id: xcode
      run: |
        xcodebuild -version
        printf 'version=%s\n' "$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

    - name: Cache pinned package sources
      uses: actions/cache@v4
      with:
        path: DerivedData/SourcePackages
        key: ${{ runner.os }}-saystone-development-spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('SayStone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

    - name: Prepare result folder
      run: mkdir -p CIResults

    - name: Run synthetic utility and isolation fixtures
      run: |
        set -euo pipefail
        bash scripts/local/run-mac-utility-fixtures.sh 2>&1 | tee CIResults/fixtures.log

    - name: Check reviewed package plugin pin
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        lock = Path('SayStone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved')
        pins = {pin['identity']: pin['state']['revision'] for pin in json.loads(lock.read_text())['pins']}
        reviewed = '0bb916c67f4b9e5c682cbe02a42c701c93ab5021'
        if pins.get('mlx-swift') != reviewed:
            raise SystemExit('Review the pinned MLX CudaBuild plugin before updating this CI allowance.')
        PY

    - name: Generate development engine metadata without models
      run: |
        python3 scripts/local/generate-engine-xcconfig.py \
          --source-root "$PWD" \
          --output "$RUNNER_TEMP/SayStoneEngineManifest.xcconfig" \
          --model-directory "$HOME/Library/Application Support/SayStone Development/Application Support/FluidAudio/Models/parakeet-tdt-0.6b-v2-coreml"

    # Build UI tests, but execute only safe hosted units with --ui-testing.
    # Local macOS rejected the ad-hoc UI runner at launch (AMFI Code=-423);
    # native UI execution uses a trusted Apple Development identity locally.
    # Model, microphone, global-hotkey and cross-app paste remain real Mac checks.
    # App/test language and deployment settings come from the native project.
    # Preserve each pinned Swift package's own compiler mode and platform floor.
    - name: Build Development native test products (ad-hoc)
      id: native_build
      run: |
        set -euo pipefail
        xcodebuild build-for-testing \
          -project SayStone.xcodeproj \
          -scheme SayStone \
          -configuration Development \
          -destination 'platform=macOS,arch=arm64' \
          -derivedDataPath DerivedData \
          -xcconfig "$RUNNER_TEMP/SayStoneEngineManifest.xcconfig" \
          -resultBundlePath CIResults/SayStoneDevelopmentBuild.xcresult \
          -disableAutomaticPackageResolution \
          -onlyUsePackageVersionsFromResolvedFile \
          -skipPackagePluginValidation \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=YES \
          2>&1 | tee CIResults/build-for-testing.log

        # Use precisely the manifest generated by this build. The cache contains
        # package sources only, so multiple manifests indicate an unexpected job.
        python3 - <<'PY'
        import os
        import plistlib
        from pathlib import Path

        manifests = sorted(Path('DerivedData/Build/Products').glob('*.xctestrun'))
        if len(manifests) != 1:
            raise SystemExit(f'Expected one native test manifest, found {len(manifests)}.')
        path = manifests[0].resolve()
        manifest = plistlib.loads(path.read_bytes())
        targets = {
            target['BlueprintName']: target
            for configuration in manifest.get('TestConfigurations', [])
            for target in configuration.get('TestTargets', [])
        }
        units = targets.get('FluidDictationIntegrationTests', {})
        ui = targets.get('SayStoneUITests', {})
        host_suffix = '/Development/SayStone Development.app'
        if not units.get('TestHostPath', '').endswith(host_suffix):
            raise SystemExit('Hosted units must use the isolated Development app.')
        if '--ui-testing' not in units.get('CommandLineArguments', []):
            raise SystemExit('Hosted units must use deterministic --ui-testing startup.')
        if not ui.get('UITargetAppPath', '').endswith(host_suffix):
            raise SystemExit('UI tests must target the isolated Development app.')
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write(f'xctestrun={path}\n')
        Path('CIResults/native-test-manifest.txt').write_text(f'{path}\n')
        PY

    - name: Repair generated framework and verify ad-hoc host
      run: |
        set -euo pipefail
        app='DerivedData/Build/Products/Development/SayStone Development.app'
        python3 scripts/local/repair-framework-bundle.py "$app" --identity - \
          2>&1 | tee CIResults/framework-repair.log
        codesign --verify --deep --strict "$app" \
          2>&1 | tee -a CIResults/framework-repair.log

    - name: Run safe hosted units without rebuilding
      env:
        SAYSTONE_XCTESTRUN: ${{ steps.native_build.outputs.xctestrun }}
      run: |
        set -euo pipefail
        xcodebuild test-without-building \
          -xctestrun "$SAYSTONE_XCTESTRUN" \
          -destination 'platform=macOS,arch=arm64' \
          -parallel-testing-enabled NO \
          -resultBundlePath CIResults/SayStoneDevelopmentTests.xcresult \
          -only-testing:FluidDictationIntegrationTests/TypingServiceTransientPasteboardTests \
          -only-testing:FluidDictationIntegrationTests/MacUtilityCoordinatorTests \
          -only-testing:FluidDictationIntegrationTests/SettingsNavigationStateTests \
          -only-testing:FluidDictationIntegrationTests/TemperatureSupportTests \
          -only-testing:FluidDictationIntegrationTests/SupportedFileExtensionsTests \
          -only-testing:FluidDictationIntegrationTests/SpeakerTurnMergingTests \
          -only-testing:FluidDictationIntegrationTests/StripThinkingTagsTests \
          -only-testing:FluidDictationIntegrationTests/HotkeyShortcutTests/testKeyboardEventMaskExcludesMouseEvents \
          -only-testing:FluidDictationIntegrationTests/HotkeyShortcutTests/testMouseObserverMaskCoversOnlyMouseDowns \
          -only-testing:FluidDictationIntegrationTests/HotkeyShortcutTests/testMouseShortcutMaskMatchesConfiguredButtons \
          2>&1 | tee CIResults/test-without-building.log

    - name: Preserve fixture logs and structured native results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: saystone-development-results-${{ github.run_id }}-${{ github.run_attempt }}
        path: CIResults/
        if-no-files-found: warn
        retention-days: 14
